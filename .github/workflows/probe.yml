name: probe-us

# 临时探测：验证 GitHub 的海外机器能否通过美区煤炉的 Cloudflare 挑战
# 只保留 workflow_dispatch，不会自动跑。测完就删。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 puppeteer
        run: |
          npm init -y > /dev/null 2>&1
          npm install puppeteer@23 --no-audit --no-fund

      - name: 无头探测
        run: node probe.js || true

      - name: 有头探测（xvfb）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a node probe.js --headful || true

      - name: 换个关键词再试一次
        run: node probe.js --kw="zb1 photocard" || true
