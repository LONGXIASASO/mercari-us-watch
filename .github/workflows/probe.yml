name: probe-us

# 临时探测：抓美区煤炉 /v1/api 的商品数据结构
# 只保留 workflow_dispatch，不会自动跑。测完就删。
on:
  workflow_dispatch:
    inputs:
      kw:
        description: '搜索关键词'
        required: false
        default: 'zhanghao'
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 xvfb + patchright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm init -y > /dev/null 2>&1
          npm install patchright --no-audit --no-fund
          npx patchright install chromium --with-deps

      - name: 抓接口结构
        run: |
          xvfb-run -a node probe_data.js --kw="${{ github.event.inputs.kw }}" || true
          echo "--- api_dump 大小 ---"
          ls -la api_dump.json 2>/dev/null || echo "无 dump"
