name: probe-us

# 临时探测：验证 GitHub 的海外机器能否通过美区煤炉的 Cloudflare 挑战
# 只保留 workflow_dispatch，不会自动跑。测完就删。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: 安装 patchright + chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install patchright --no-audit --no-fund
          npx patchright install chromium --with-deps

      - name: patchright 自带 chromium
        run: xvfb-run -a node probe_patchright.js || true

      - name: patchright 真实 Chrome
        run: xvfb-run -a node probe_patchright.js --channel=chrome || true

      - name: 对比 puppeteer 裸跑
        run: |
          npm install puppeteer@23 --no-audit --no-fund > /dev/null 2>&1
          node probe.js || true
